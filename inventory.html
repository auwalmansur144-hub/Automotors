<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory — AutoMotors</title>
<meta name="description" content="Browse the current inventory of cars available at AutoMotors, Kano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">Auto<span>Motors</span></a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="visit.html">Visit</a></li>
    </ul>
  </div>
</header>

<section class="page-head">
  <div class="container">
    <div class="eyebrow">Inventory</div>
    <h1 class="display">Browse our <em>collection</em>.</h1>
    <p>Every vehicle in stock at our Kofar Kabuga showroom. Use the filters to narrow your search.</p>
  </div>
</section>

<section class="block">
  <div class="container">
    <div class="inv-layout">
      <aside class="filters">
        <h3>Filters</h3>
        <div class="field">
          <label for="f-brand">Brand</label>
          <select id="f-brand"><option value="all">All brands</option></select>
        </div>
        <div class="field">
          <label for="f-year">Year</label>
          <select id="f-year"><option value="all">All years</option></select>
        </div>
        <div class="field">
          <label for="f-cond">Condition</label>
          <select id="f-cond">
            <option value="all">Any</option>
            <option value="New">New</option>
            <option value="Pre-owned">Pre-owned</option>
          </select>
        </div>
        <div class="field">
          <label for="f-price">Max price · <span id="f-price-label" class="muted"></span></label>
          <input id="f-price" type="range" min="10000000" max="60000000" step="1000000" value="60000000">
        </div>
        <button id="f-reset" class="btn btn-outline" style="width:100%;justify-content:center">Reset filters</button>
      </aside>

      <div>
        <p id="count" class="results-count"></p>
        <div id="car-grid" class="car-grid"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="brand" style="color:var(--primary-fg)">Auto<span>Motors</span></div>
    <small>© <span data-year></span> AutoMotors · Kano, Nigeria</small>
  </div>
</footer>
<script src="js/main.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>

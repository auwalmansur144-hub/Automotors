<header class="site-header">

    <button class="menu-btn" aria-label="Menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>

      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="visit.html">Visit</a></li>
    </ul>
  </div>

<section class="page-head">
  <div class="container">
    <div class="eyebrow">Gallery</div>
    <h1 class="display">A look <em>around the lot</em>.</h1>
    <p>Click any photo to view it full-size.</p>
  </div>

<section class="block">
  <div class="container">
    <div class="gallery">
      <div class="item wide"><img src="images/hero-car.jpg" alt="Featured car"></div>
      <div class="item tall"><img src="images/car-3.jpg" alt="Toyota Land Cruiser"></div>
      <div class="item"><img src="images/car-1.jpg" alt="Toyota Camry"></div>
      <div class="item"><img src="images/car-2.jpg" alt="Lexus RX"></div>

      <div class="item"><img src="images/car-6.jpg" alt="Ford Ranger"></div>
    </div>
  </div>
</section>

<div id="lightbox" class="lightbox" role="dialog" aria-label="Image preview">
  <button class="close" aria-label="Close">×</button>
  <img src="" alt="">
</div>

<footer class="site-footer">
  <div class="container footer-row">
    <div class="brand" style="color:var(--primary-fg)">Auto<span>Motors</span></div>
